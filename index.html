<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mama Tolu Menu Consultant</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#222;--mut:#6b6b6b;--g:#1f4d36;--gd:#1f4d36;--line:#e2dfd9;--chip:#fff;--gold:#e8a317;--warnc:#9a5b00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
h1,h2,h3,h4,.logo{font-family:Oswald,"Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 30px}
nav{background:#fff;box-shadow:0 1px 0 #e6e6e6;position:sticky;top:0;z-index:10}
nav .in{max-width:1160px;margin:0 auto;padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.5rem;font-weight:700;text-decoration:none;color:#b3261e}.logo b{color:#171717}
nav a.back{font-weight:600;font-size:.92rem;text-decoration:none;color:#222}nav a.back:hover{color:#b3261e}
.hero{position:relative;background:#163a29 url(/images/plant-based.jpg) center/cover;color:#fff;padding:64px 22px}
.hero::before{content:"";position:absolute;inset:0;background:rgba(14,40,28,.82)}
.hero>div{position:relative;max-width:980px;margin:0 auto}
.hero h1{margin:0 0 12px;font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.05}
.hero p{margin:0;max-width:40em;color:#d7e6dc;font-size:1.05rem}
#wiz{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);padding:22px;margin:-28px 0 22px;position:relative;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
#wiz h3{margin:0 0 14px;font-size:1.25rem;color:var(--g)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.big button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);font:600 .92rem Inter,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.big button span{font-size:1.7rem;line-height:1}.big button:hover,.big button:focus-visible{border-color:var(--g);background:#eef5f0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{background:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:30px;font-size:.84rem;cursor:pointer;font-weight:500}.chip:hover{border-color:var(--g);color:var(--g)}
.msg{margin:14px 0;display:flex}.msg.u{justify-content:flex-end}
.bub{max-width:100%;padding:16px 18px;border-radius:3px;font-size:.96rem;background:var(--card);border:1px solid var(--line)}
.u .bub{background:var(--g);color:#fff;border-color:var(--g);max-width:78%}
.tag{font-size:.78rem;color:var(--mut);margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.rc{border:1px solid var(--line);border-top:4px solid var(--g);border-radius:3px;padding:14px;font-size:.86rem;background:#fff}
.rc h4{margin:0 0 8px;font-size:1.05rem;color:var(--g)}
.rc .b{display:inline-block;background:var(--g);color:#fff;border-radius:2px;padding:2px 9px;margin:2px 4px 2px 0;font-size:.76rem;font-weight:600}
.bar{height:6px;background:#ece9e3;margin:4px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.warn{color:var(--warnc);font-size:.8rem;margin-top:5px}
.al{font-size:.8rem;margin-top:8px;padding:5px 9px;background:#f3f6f4;border-left:3px solid var(--g)}
.al.has{border-color:#b3261e;background:#fbefed;color:#8f1d17;font-weight:600}
.est{font-size:.76rem;color:var(--mut);margin-top:5px}
.mic,.listen{background:#fff;color:var(--g);font-weight:600;cursor:pointer;border:1px solid var(--line);border-radius:3px}
.mic{padding:0 16px;font-size:1.1rem}.mic.on{background:#b3261e;color:#fff;border-color:#b3261e}.listen{margin-top:12px;padding:8px 16px;font-size:.88rem}.listen:hover{border-color:var(--g)}
.row{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:12px 0}
input{flex:1;padding:14px;border:1px solid var(--line);border-radius:3px;font:1rem Inter,sans-serif;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--g);outline-offset:0}
button.send{background:#b3261e;color:#fff;border:0;border-radius:3px;padding:0 26px;font:600 1rem Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}button.send:hover{background:#8f1d17}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>
<nav><div class="in"><a class="logo" href="/">Mama Tolu <b>Kitchen</b></a><a class="back" href="/">Back to restaurant</a></div></nav>
<header class="hero"><div><h1>Plant-based and alternative proteins</h1><p>Tell us the dish, your budget and your kitchen. We recommend a plant-based swap, show the costs, and explain how to cook it. Ask follow-ups any time, like "make it cheaper".</p></div></header>
<div class="wrap">
<div id="wiz"></div>
<div class="chips" id="chips"></div>
<div id="log"></div>
<div class="row"><input id="q" placeholder="e.g. Cheap chewy swap for beef suya under ₦650, easy prep, 150 plates a week" autofocus><button class="mic" id="mic" title="Speak" onclick="listenMic()">Voice</button><button class="send" onclick="send()">Ask</button></div>
</div>
<script>
const starters=["Cheap chewy swap for beef suya under ₦650, easy prep, 150 plates a week","Shawarma swap that still tastes authentic, 200 plates a week","Tender swap for chicken pepper soup, high protein","Goat asun alternative, smoky, easy to find in Abuja markets","Suya swap for a customer with a peanut allergy"];
chips.innerHTML=starters.map((s,i)=>`<span class="chip" onclick="send(starters[${i}])">${s.split(',')[0]}</span>`).join("");
let state={},history=[],lastAnswer="",pickMeat=null;
const MEATS=[["🐄","Beef","beef"],["🐐","Goat","goat"],["🐔","Chicken","chicken"],["🦃","Turkey","turkey"],["🐟","Fish","fish"],["➕","More",null],["✏️","Type it",null]];
const OTHERS=[["🥚","Egg","egg"],["🐌","Snail","snail"],["🦐","Prawns","prawns"],["🐟","Stockfish","stockfish"],["🐄","Ponmo (cow skin)","ponmo"],["🐄","Shaki (tripe)","shaki"],["🫀","Liver","liver"],["🐔","Gizzard","gizzard"]];
const DISHES_EGG=[["🍳","Scramble","scramble"],["🥘","Stew","stew"],["🍗","Fried","fried"],["🍲","Soup","pepper soup"]];
const DISHES=[["🍢","Suya","suya"],["🌯","Shawarma","shawarma"],["🍲","Pepper soup","pepper soup"],["🥘","Stew","stew"],["🍗","Fried","fried"],["🍚","Jollof rice","jollof rice"]];
const AFTER=[["💰","Cheaper","make it cheaper"],["⚡","Easier","make it easier"],["🔁","New dish",null]];
function bigBtns(list,fn){return `<div class="big">${list.map((x,i)=>`<button onclick="${fn}(${i})"><span>${x[0]}</span>${x[1]}</button>`).join("")}</div>`}
function wiz(step){
  const w=document.getElementById("wiz");
  if(step=="meat"){pickMeat=null;w.innerHTML="<h3>1. What meat do you want to replace?</h3>"+bigBtns(MEATS,"tapMeat")}
  else if(step=="more"){w.innerHTML="<h3>Pick the one you cook</h3>"+bigBtns(OTHERS,"tapOther")+`<p><button class="listen" onclick="wiz('meat')">Back</button></p>`}
  else if(step=="dish"){w.innerHTML=`<h3>2. How do you cook your ${esc(pickMeat[1].toLowerCase())}?</h3>`+bigBtns(pickMeat[2]=="egg"?DISHES_EGG:DISHES,"tapDish")+`<p><button class="listen" onclick="wiz('meat')">Back</button></p>`}
  else{w.innerHTML="<h3>What next?</h3>"+bigBtns(AFTER,"tapAfter")}
}
function tapMeat(i){
  if(MEATS[i][2]===null){
    if(MEATS[i][1]=="More"){wiz("more")}
    else{q.placeholder="Type any protein and dish, e.g. ponmo stew, egg sauce, snail, prawns";q.focus()}
    return}
  pickMeat=MEATS[i];wiz("dish")}
function tapOther(i){pickMeat=OTHERS[i];wiz("dish")}
function tapDish(i){const list=pickMeat[2]=="egg"?DISHES_EGG:DISHES;const m=pickMeat[2]+" "+list[i][2];wiz("after");send(m)}
function tapAfter(i){if(AFTER[i][2])send(AFTER[i][2]);else wiz("meat")}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listenMic(){
  if(!SR){alert("Voice typing works in Chrome or Edge. You can still tap the pictures.");return}
  const r=new SR(),b=document.getElementById("mic");r.lang="en-NG";r.interimResults=false;
  r.onstart=()=>b.classList.add("on");r.onend=()=>b.classList.remove("on");
  r.onresult=e=>{q.value=e.results[0][0].transcript;send()};r.onerror=()=>b.classList.remove("on");r.start();
}
function say(){
  if(!window.speechSynthesis)return;speechSynthesis.cancel();
  const t=lastAnswer.replace(/\*\*/g,"").replace(/₦(\d[\d,]*)/g,"$1 naira").replace(/CO₂e/g,"carbon").replace(/\n+/g,". ");
  const u=new SpeechSynthesisUtterance(t);u.lang="en-NG";u.rate=.92;speechSynthesis.speak(u);
}
wiz("meat");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
const N=n=>Number(n).toLocaleString();
function add(cls,html){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=`<div class="bub">${html}</div>`;log.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"});return d}
function card(r,i){return `<div class="rc"><h4>#${i+1} ${esc(r.name)}${r.kind=="blend"?" (blend)":""}</h4>
<span class="b">${r.fit}% fit</span><span class="b">₦${N(r.cost)}/plate</span><span class="b">${r.protein}g protein</span>
<div style="margin-top:4px">Texture match ${r.texture}%</div><div class="bar"><i style="width:${r.texture}%"></i></div>
<div><b>₦${N(r.save_week)}</b>/week saved · ${r.co2_week} kg CO₂e</div>
<div style="color:var(--mut)">${r.difficulty} · ${r.prep} min · ${r.availability} availability</div>
<div class="al ${r.allergens.length?"has":""}">${r.allergens.length?"Contains: "+esc(r.allergens.join(", ")):"No major allergens in the recipe"}</div>
${r.price_confidence=="Low"?`<div class="est">Price is an estimate. Confirm with your supplier.</div>`:""}
${r.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join("")}</div>`}
async function send(t){
  const m=(t||q.value).trim();if(!m)return;q.value="";add("u",esc(m));
  const w=add("a","<span class='tag'>Working out the best options…</span>");
  try{
    const r=await (await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,history,state})})).json();
    state=r.state;history.push({role:"user",content:m},{role:"assistant",content:r.answer});
    const u=r.understood?`<div class="tag">Understood: <b>${esc(r.understood.dish)}</b> · ₦${N(r.understood.budget)} cap · ${r.understood.max_difficulty} prep · ${r.understood.plates} plates/wk · priority: ${r.understood.goal}${r.understood.avoid&&r.understood.avoid.length?" · avoiding: <b>"+esc(r.understood.avoid.join(", "))+"</b>":""} · ${r.mode=="offline"?"offline engine":"AI ("+esc(r.mode)+") + data engine"}</div>`:"";
    const rel=r.recommendations[0]&&r.recommendations[0].relaxed?`<div class="warn">${esc(r.recommendations[0].relaxed)}</div>`:"";
    lastAnswer=r.answer||"";
    w.querySelector(".bub").innerHTML=u+fmt(r.answer)+rel+`<div class="cards">${r.recommendations.map(card).join("")}</div><button class="listen" onclick="say()">Listen to this answer</button>`;
  }catch(e){w.querySelector(".bub").textContent="Could not reach the server. Is uvicorn running?"}
  w.scrollIntoView({behavior:"smooth",block:"end"});
}
q.addEventListener("keydown",e=>{if(e.key=="Enter")send()});
</script></body></html>
